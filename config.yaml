# ==========================================================================
# Configuration for the Pabna urban tree canopy and biomass pipeline.
# The allometric coefficients below are the published values used in the
# manuscript (Equations 2 and 3). Only the file paths normally need editing.
# ==========================================================================

project:
  name: pabna-urban-forest
  crs: "EPSG:32645"          # UTM zone 45N, the projected CRS used throughout
  seed: 42

paths:
  data_dir: data
  output_dir: outputs
  checkpoint_dir: checkpoints

  # Step 1: annotated UAV tiles in COCO format (Roboflow-style folders)
  seg_dataset_dir: data/uav_tiles          # expects train/ valid/ test/

  # Step 2: full UAV orthomosaics, one GeoTIFF per survey field. The Zenodo
  # deposit holds only raw photographs; build these yourself with
  # photogrammetry software (Agisoft Metashape, Pix4Dmapper, OpenDroneMap).
  field_orthomosaics:
    Field1: data/Field1_ortho.tif
    Field2: data/Field2_ortho.tif
    Field3: data/Field3_ortho.tif

  # Reference canopy masks for the three fields, on the orthomosaic grid.
  # Not part of the deposit. Step 3 uses these when present, otherwise it
  # falls back to the step 2 predictions (with no ground truth to score them
  # against).
  field_masks:
    Field1: data/Field1_mask.tif
    Field2: data/Field2_mask.tif
    Field3: data/Field3_mask.tif

  # ---- Step 0 inputs, Equation 1: CHM = DSM - DEM ----
  # UAV digital surface models. Build these from the same raw photographs as
  # the orthomosaics above, in the same photogrammetry run.
  field_dsm:
    Field1: data/Field1_dsm.tif
    Field2: data/Field2_dsm.tif
    Field3: data/Field3_dsm.tif

  # Terrain reference. ALOS PALSAR 12.5 m DEM, free from the Alaska Satellite
  # Facility. Resampled onto each DSM grid by step 0.
  terrain_dem: data/alos_palsar_dem.tif

  # Canopy height models. Step 0 writes these; step 3 reads them to get crown
  # heights. Point them at your own CHM instead if you already have one.
  field_chm:
    Field1: outputs/Field1_chm.tif
    Field2: outputs/Field2_chm.tif
    Field3: outputs/Field3_chm.tif

  # Step 4 inputs, and the city-wide mask it produces
  satellite_image: data/planetscope_superdove.tif   # 8 band, 3 m
  ward_boundaries: data/ward_boundary.geojson
  citywide_tree_mask: data/citywide_tree_mask.tif   # reuse instead of step 4

segmentation:
  architecture: segformer        # segformer | unet | deeplabv3plus
  encoder: mit_b2
  # Leave empty to use checkpoints/<tag>_best.pt produced by step 1. Set it to a
  # downloaded weights file to skip training altogether.
  checkpoint: ""
  use_exg: true                  # append the excess-green band as a 4th channel
  img_size: 512
  batch_size: 6
  epochs: 100
  learning_rate: 0.00006
  weight_decay: 0.01
  num_workers: 2

inference:
  tile_size: 640
  tile_overlap: 64
  probability_threshold: 0.5

chm:
  max_height_m: 45.0             # taller values are treated as artefacts
  min_height_m: 0.0              # negative differences are clipped to zero

crowns:
  min_crown_area_m2: 1.5         # smaller segments are discarded as noise
  peak_min_distance_px: 5        # watershed seed separation
  height_percentile: 95          # per-crown height statistic from the CHM

classifier:
  n_estimators: 500
  max_depth: null
  min_samples_leaf: 2
  cv_folds: 5
  decision_threshold: 0.50
  local_window_sizes: [3, 5, 9]  # window sizes for local mean features

allometry:
  # ----------------------------------------------------------------------
  # Equation 2 of the manuscript. Jucker et al. (2017), crown height and
  # crown diameter to stem diameter:
  #
  #     D_cm = a * (H_m * CD_m) ** b * exp(sigma_squared / 2)
  #
  # The exponential term is the back-transformation correction for a model
  # fitted in log space.
  # ----------------------------------------------------------------------
  jucker:
    a: 0.557
    b: 0.809
    sigma_squared: 0.0562

  # ----------------------------------------------------------------------
  # Equation 3 of the manuscript. Chave et al. (2014) pantropical model:
  #
  #     AGB_kg = a * (rho * D_cm ** 2 * H_m) ** b
  # ----------------------------------------------------------------------
  chave:
    a: 0.0673
    b: 0.976

  # Community wood density, Chave et al. (2009). The range is the species
  # spread used for the sensitivity test reported in Section 2.5.
  wood_density_g_cm3: 0.55
  wood_density_range: [0.40, 0.70]

carbon:
  carbon_fraction: 0.47          # IPCC default carbon fraction of dry biomass
  co2_per_carbon: 3.67           # molecular mass ratio 44/12

study_area:
  total_area_ha: 1081.33
  n_wards: 15
